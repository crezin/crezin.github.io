<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para você 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --purple-deep: #6d28d9;
    --purple-mid:  #8b5cf6;
    --purple-soft: #c4b5fd;
    --purple-pale: #ede9fe;
    --pink-acc:    #f472b6;
    --gold:        #fbbf24;
    --gold-pale:   #fde68a;
    --green-stem:  #4ade80;
    --bg:          #000000;
    --bg2:         #000000;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: #000;
    font-family: 'Lato', sans-serif;
  }

  .page {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  /* ── STARS ── */
  #stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100%{ opacity:.12; transform:scale(1); }
    50%    { opacity:1;   transform:scale(1.8); }
  }

  /* ── FLOATING PETALS ── */
  #floaters { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .pfloat {
    position: absolute;
    width: 10px; height: 16px;
    border-radius: 50% 50% 50% 0;
    opacity: 0;
    animation: pfall linear infinite;
  }
  @keyframes pfall {
    0%  { transform:translateY(-20px) rotate(0deg); opacity:0; }
    10% { opacity:.6; }
    90% { opacity:.25; }
    100%{ transform:translateY(110vh) rotate(450deg); opacity:0; }
  }

  /* ── HEADER ── */
  .header {
    z-index: 10;
    padding: 36px 24px 0;
    text-align: center;
    opacity: 0;
    animation: fadeUp .8s ease 5.5s forwards;
  }
  .header-label {
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--purple-soft);
    margin-bottom: 8px;
  }
  .header-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 8vw, 42px);
    font-weight: 400;
    color: #ede9fe;
    line-height: 1.15;
  }
  .header-title em {
    font-style: italic;
    color: var(--purple-soft);
  }

  /* ── FLOWER STAGE ── */
  .stage {
    flex: 1;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 8px 0;
  }

  svg.flower { overflow: visible; }

  /* aura radiante */
  .aura {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: auraPulse 3.5s ease-in-out 5s infinite;
    opacity: 0;
  }
  .aura-1 {
    width: min(72vw, 280px);
    height: min(72vw, 280px);
    background: radial-gradient(circle, rgba(139,92,246,.38) 0%, rgba(109,40,217,.18) 40%, transparent 72%);
    animation-delay: 5s;
  }
  .aura-2 {
    width: min(90vw, 360px);
    height: min(90vw, 360px);
    background: radial-gradient(circle, rgba(196,165,250,.18) 0%, rgba(139,92,246,.08) 50%, transparent 75%);
    animation-delay: 5.3s;
  }
  .aura-3 {
    width: min(110vw, 440px);
    height: min(110vw, 440px);
    background: radial-gradient(circle, rgba(244,114,182,.08) 0%, rgba(139,92,246,.05) 40%, transparent 70%);
    animation-delay: 5.6s;
  }
  @keyframes auraPulse {
    0%,100%{ opacity:.55; transform:scale(.95); }
    50%    { opacity:1;   transform:scale(1.08); }
  }

  /* stem */
  .stem-path {
    stroke: var(--green-stem);
    stroke-width: 5;
    stroke-linecap: round;
    fill: none;
    stroke-dasharray: 340;
    stroke-dashoffset: 340;
    animation: growS 1.5s cubic-bezier(.4,0,.2,1) .3s forwards;
  }
  @keyframes growS { to{ stroke-dashoffset:0; } }

  /* leaves */
  .leaf { opacity:0; animation:leafPop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  .l1 { animation-delay:1.7s; transform-origin:50% 72%; }
  .l2 { animation-delay:2.0s; transform-origin:50% 62%; }
  @keyframes leafPop {
    0%  { opacity:0; transform:scale(0); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* petals */
  .pet {
    transform-origin: 50% 50%;
    transform: scale(0) rotate(var(--r));
    animation: petalOpen .6s cubic-bezier(.34,1.45,.64,1) forwards;
  }
  .pet:nth-child(1){ --r:0deg;   animation-delay:2.3s; }
  .pet:nth-child(2){ --r:45deg;  animation-delay:2.42s; }
  .pet:nth-child(3){ --r:90deg;  animation-delay:2.54s; }
  .pet:nth-child(4){ --r:135deg; animation-delay:2.66s; }
  .pet:nth-child(5){ --r:180deg; animation-delay:2.78s; }
  .pet:nth-child(6){ --r:225deg; animation-delay:2.90s; }
  .pet:nth-child(7){ --r:270deg; animation-delay:3.02s; }
  .pet:nth-child(8){ --r:315deg; animation-delay:3.14s; }
  @keyframes petalOpen { to{ transform:scale(1) rotate(var(--r)); } }

  /* center */
  .center-g {
    transform-origin: 50% 50%;
    transform: scale(0);
    animation: petalOpen .4s cubic-bezier(.34,1.56,.64,1) 3.35s forwards;
  }

  /* stamens */
  .stamen {
    transform-origin: 50% 50%;
    transform: scale(0);
    animation: petalOpen .35s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .st1 { animation-delay:3.55s; } .st2 { animation-delay:3.62s; }
  .st3 { animation-delay:3.69s; } .st4 { animation-delay:3.76s; }
  .st5 { animation-delay:3.83s; } .st6 { animation-delay:3.90s; }
  .st7 { animation-delay:3.97s; } .st8 { animation-delay:4.04s; }
  .st9 { animation-delay:4.11s; } .st10{ animation-delay:4.18s; }
  .st11{ animation-delay:4.25s; } .st12{ animation-delay:4.32s; }

  /* breathe */
  .breathe {
    transform-origin: 50% 50%;
    animation: breathe 4s ease-in-out 5s infinite;
  }
  @keyframes breathe {
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.035); }
  }

  /* ── MESSAGE ── */
  .msg-wrap {
    z-index: 10;
    width: 100%;
    padding: 0 20px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: translateY(22px);
    animation: fadeUp .75s ease 5.5s forwards;
  }
  @keyframes fadeUp { to{ opacity:1; transform:translateY(0); } }

  .msg-card {
    background: rgba(255,255,255,.055);
    border: 0.5px solid rgba(196,165,250,.28);
    border-radius: 20px;
    padding: 22px 28px;
    text-align: center;
    width: 100%;
    max-width: 360px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .msg-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 500;
    color: #ede9fe;
    margin-bottom: 10px;
  }
  .msg-body {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(15px, 4vw, 18px);
    font-style: italic;
    color: var(--purple-soft);
    line-height: 1.8;
  }
  .hb {
    display: inline-block;
    color: var(--pink-acc);
    animation: hb 1.6s ease-in-out infinite;
  }
  @keyframes hb {
    0%,100%{ transform:scale(1); }
    30%    { transform:scale(1.4); }
    60%    { transform:scale(1.15); }
  }

  .btn-replay {
    background: transparent;
    border: 0.5px solid rgba(196,165,250,.35);
    border-radius: 50px;
    padding: 10px 28px;
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: .1em;
    color: var(--purple-soft);
    cursor: pointer;
    transition: background .2s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-replay:active { background: rgba(139,92,246,.18); border-color: rgba(196,165,250,.6); }

  /* particles */
  .part {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
    animation: pex ease-out forwards;
    opacity: 0;
  }
  @keyframes pex {
    0%  { transform:translate(0,0) scale(1.1); opacity:1; }
    100%{ transform:translate(var(--px),var(--py)) scale(0); opacity:0; }
  }

  /* ground */
  .ground {
    width: 100%;
    height: 70px;
    background: #000;
    position: relative;
    z-index: 8;
    flex-shrink: 0;
  }
  .grass-row { position:absolute; top:0; left:0; width:100%; display:flex; justify-content:space-around; align-items:flex-end; height:50px; }
  .blade {
    width: 3px;
    border-radius: 3px 3px 0 0;
    background: #14532d;
    transform-origin: bottom center;
    animation: sway ease-in-out infinite;
  }
  @keyframes sway { 0%,100%{ transform:rotate(-7deg); } 50%{ transform:rotate(7deg); } }
</style>
</head>
<body>
<div class="page" id="page">

  <div id="stars"></div>
  <div id="floaters"></div>

  <div class="header">
    <p class="header-label">uma flor para você</p>
    <h1 class="header-title">com todo o meu<br><em>amor</em></h1>
  </div>

  <div class="stage">
    <div class="aura aura-3" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    <div class="aura aura-2" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    <div class="aura aura-1" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    <svg id="flowerSvg" class="flower"
         viewBox="0 0 240 360"
         style="width:min(82vw,320px);height:auto;">

      <path class="stem-path" d="M120 350 Q112 305 114 250 Q117 210 120 180"/>

      <ellipse class="leaf l1" cx="140" cy="258" rx="32" ry="12" fill="#2d6e3a" transform="rotate(35 120 270)" opacity=".9"/>
      <ellipse class="leaf l1" cx="140" cy="258" rx="28" ry="8"  fill="#3aad5e" transform="rotate(35 120 270)" opacity=".45"/>
      <ellipse class="leaf l2" cx="100" cy="228" rx="30" ry="11" fill="#2d6e3a" transform="rotate(-32 120 238)" opacity=".9"/>
      <ellipse class="leaf l2" cx="100" cy="228" rx="26" ry="7"  fill="#3aad5e" transform="rotate(-32 120 238)" opacity=".45"/>

      <g class="breathe" style="transform-origin:120px 180px">
        <g style="transform-origin:120px 180px">
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#a855f7" opacity="1"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#e0b8ff" opacity=".55"/>
          </g>
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#7c3aed" opacity="1" transform="rotate(45 120 180)"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#d0a8ff" opacity=".5" transform="rotate(45 120 180)"/>
          </g>
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#a855f7" opacity="1" transform="rotate(90 120 180)"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#e0b8ff" opacity=".55" transform="rotate(90 120 180)"/>
          </g>
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#7c3aed" opacity="1" transform="rotate(135 120 180)"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#d0a8ff" opacity=".5" transform="rotate(135 120 180)"/>
          </g>
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#a855f7" opacity="1" transform="rotate(180 120 180)"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#e0b8ff" opacity=".55" transform="rotate(180 120 180)"/>
          </g>
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#7c3aed" opacity="1" transform="rotate(225 120 180)"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#d0a8ff" opacity=".5" transform="rotate(225 120 180)"/>
          </g>
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#a855f7" opacity="1" transform="rotate(270 120 180)"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#e0b8ff" opacity=".55" transform="rotate(270 120 180)"/>
          </g>
          <g class="pet" style="transform-origin:120px 180px">
            <path d="M120 180 C104 154 100 115 120 88 C140 115 136 154 120 180Z" fill="#7c3aed" opacity="1" transform="rotate(315 120 180)"/>
            <path d="M120 180 C114 158 112 124 120 100 C128 124 126 158 120 180Z" fill="#d0a8ff" opacity=".5" transform="rotate(315 120 180)"/>
          </g>
        </g>

        <g class="center-g" style="transform-origin:120px 180px">
          <circle cx="120" cy="180" r="20" fill="#92400e"/>
          <circle cx="120" cy="180" r="15" fill="#b45309"/>
          <circle cx="120" cy="180" r="10" fill="#d97706"/>
        </g>

        <line class="stamen st1"  x1="120" y1="170" x2="120" y2="160" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st1"  cx="120" cy="159" r="2.2" fill="#fde68a"/>
        <line class="stamen st2"  x1="127" y1="172" x2="133" y2="163" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st2"  cx="134" cy="162" r="2.2" fill="#fde68a"/>
        <line class="stamen st3"  x1="131" y1="179" x2="140" y2="178" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st3"  cx="141" cy="177" r="2.2" fill="#fde68a"/>
        <line class="stamen st4"  x1="128" y1="187" x2="135" y2="195" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st4"  cx="136" cy="196" r="2.2" fill="#fde68a"/>
        <line class="stamen st5"  x1="121" y1="191" x2="121" y2="201" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st5"  cx="121" cy="202" r="2.2" fill="#fde68a"/>
        <line class="stamen st6"  x1="113" y1="188" x2="106" y2="196" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st6"  cx="105" cy="197" r="2.2" fill="#fde68a"/>
        <line class="stamen st7"  x1="109" y1="181" x2="100" y2="180" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st7"  cx="99"  cy="179" r="2.2" fill="#fde68a"/>
        <line class="stamen st8"  x1="112" y1="173" x2="105" y2="165" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
        <circle class="stamen st8"  cx="104" cy="164" r="2.2" fill="#fde68a"/>
        <line class="stamen st9"  x1="123" y1="171" x2="128" y2="163" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
        <circle class="stamen st9"  cx="129" cy="162" r="1.8" fill="#fcd34d"/>
        <line class="stamen st10" x1="116" y1="171" x2="111" y2="163" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
        <circle class="stamen st10" cx="110" cy="162" r="1.8" fill="#fcd34d"/>
        <line class="stamen st11" x1="126" y1="186" x2="132" y2="192" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
        <circle class="stamen st11" cx="133" cy="193" r="1.8" fill="#fcd34d"/>
        <line class="stamen st12" x1="114" y1="188" x2="108" y2="194" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
        <circle class="stamen st12" cx="107" cy="195" r="1.8" fill="#fcd34d"/>
      </g>
    </svg>
  </div>

  <div class="msg-wrap">
    <div class="msg-card">
      <p class="msg-title">Para você <span class="hb">&#9829;</span></p>
      <p class="msg-body">
        Assim como essa flor nasce do nada,<br>
        o meu amor por você floresce<br>
        todo dia de novo.
      </p>
    </div>
    <button class="btn-replay" onclick="replay()">florescer de novo</button>
  </div>

  <div class="ground">
    <div class="grass-row" id="grass"></div>
  </div>
</div>

<script>
  const page = document.getElementById('page');

  /* stars */
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = 1 + Math.random() * 2.2;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*92}%;left:${Math.random()*100}%;animation-duration:${1.8+Math.random()*3.5}s;animation-delay:${Math.random()*5}s`;
    document.getElementById('stars').appendChild(s);
  }

  /* grass */
  const gr = document.getElementById('grass');
  for (let i = 0; i < 65; i++) {
    const b = document.createElement('div');
    b.className = 'blade';
    const h = 14 + Math.random() * 30;
    b.style.cssText = `height:${h}px;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*2.5}s;opacity:${.45+Math.random()*.55}`;
    gr.appendChild(b);
  }

  /* floating petals */
  const pc = ['#9333ea','#7c3aed','#c4b5fd','#ddd6fe','#f0abfc','#b87fe8'];
  function spawnPetal() {
    const p = document.createElement('div');
    p.className = 'pfloat';
    p.style.cssText = `left:${5+Math.random()*90}%;bottom:70px;background:${pc[Math.floor(Math.random()*pc.length)]};animation-duration:${7+Math.random()*7}s;animation-delay:${Math.random()*2}s;transform:rotate(${Math.random()*360}deg)`;
    document.getElementById('floaters').appendChild(p);
    setTimeout(() => p.remove(), 16000);
  }
  for (let i = 0; i < 12; i++) setTimeout(spawnPetal, i * 500 + 5200);
  setInterval(spawnPetal, 1800);

  /* burst */
  function burst() {
    const cols = ['#c084fc','#9333ea','#ddd6fe','#fbbf24','#f0abfc','#ede9fe','#a78bfa'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight * 0.42;
    for (let i = 0; i < 32; i++) {
      const el = document.createElement('div');
      el.className = 'part';
      const sz = 4 + Math.random() * 9;
      const ang = Math.random() * Math.PI * 2;
      const dist = 55 + Math.random() * 150;
      el.style.cssText = `width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};left:${cx - sz/2}px;top:${cy}px;--px:${Math.cos(ang)*dist}px;--py:${Math.sin(ang)*dist - 60}px;animation-duration:${.7+Math.random()*.7}s;animation-delay:${Math.random()*.2}s`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }
  }
  setTimeout(burst, 4400);

  /* replay */
  function replay() {
    const old = document.getElementById('flowerSvg');
    const clone = old.cloneNode(true);
    old.replaceWith(clone);
    const wrap = document.querySelector('.msg-wrap');
    const head = document.querySelector('.header');
    [wrap, head].forEach(el => {
      el.style.animation = 'none';
      el.style.opacity = '0';
      el.style.transform = 'translateY(22px)';
      void el.offsetWidth;
      el.style.animation = 'fadeUp .75s ease 5.5s forwards';
    });
    setTimeout(burst, 4400);
  }
</script>
</body>
</html>
